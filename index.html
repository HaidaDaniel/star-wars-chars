<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Star Wars Characters Library - Browse and explore detailed information about your favorite Star Wars heroes" />
    <meta name="keywords" content="Star Wars, characters, heroes, Star Wars API, SWAPI" />
    <meta name="author" content="Star Wars Library" />
    <meta property="og:title" content="Star Wars Characters Library" />
    <meta property="og:description" content="Browse and explore detailed information about your favorite Star Wars heroes" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1e40af" />
    <title>Star Wars Characters Library</title>
    <style>
      /* Static styles to minimize shift when React loads */
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        color: #fafafa;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading skeleton matching the app structure */
      .static-loading {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        padding: 1rem;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 100vh;
      }
      @media (min-width: 768px) {
        .static-loading {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .static-card {
        background-color: #1a1a1a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
        height: 550px;
        padding: 1rem;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .static-card-header {
        height: 2rem;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      .static-card-content {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .static-card-line {
        height: 1rem;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 0.25rem;
      }
      .static-card-line:nth-child(odd) {
        width: 80%;
      }
      .static-card-line:nth-child(even) {
        width: 60%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static loading skeleton to minimize shift -->
      <div class="static-loading">
        <div class="static-card">
          <div class="static-card-header"></div>
          <div class="static-card-content">
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
          </div>
        </div>
        <div class="static-card">
          <div class="static-card-header"></div>
          <div class="static-card-content">
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
            <div class="static-card-line"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
